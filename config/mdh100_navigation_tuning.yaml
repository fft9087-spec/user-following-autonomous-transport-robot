# Validated unloaded v11 corridor profile, 2026-11-18.
# Keeps the original 3cm footprint padding and collision checks.
controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 0.3
      max_vel_theta: 0.85
      max_speed_xy: 0.3
      acc_lim_theta: 0.8
      decel_lim_theta: -0.8
      rotate_to_heading_angular_vel: 0.65
      max_angular_accel: 0.8
behavior_server:
  ros__parameters:
    max_rotational_vel: 0.85
    rotational_acc_lim: 0.8
velocity_smoother:
  ros__parameters:
    max_velocity:
    - 0.3
    - 0.0
    - 0.85
    min_velocity:
    - -0.3
    - 0.0
    - -0.85
    max_accel:
    - 0.35
    - 0.0
    - 0.8
    max_decel:
    - -0.35
    - 0.0
    - -0.8
sim_motion_guard:
  ros__parameters:
    max_linear_speed: 0.3
    max_angular_speed: 0.85
    max_angular_accel: 0.8
